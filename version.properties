# The one version source for Fathom.
#
# versionName is the marketing version. versionCode is the Android version
# code and the iOS build number; they must move together because a release
# uploads the same build to both stores. Bump versionCode before every build
# that leaves this machine, then run:
#
#     python3 scripts/sync-version.py
#
# The script writes the values into iOS/project.yml and iOS/Info.plist.
versionName=0.2.1
versionCode=10
