# The iOS project is generated, not checked in.
#
# A checked-in .xcodeproj is a 900-line file that every merge conflicts on and
# that no diff can be read in. This spec is the source: `xcodegen generate`
# inside iOS/ rebuilds the project, and the .xcodeproj stays gitignored.
#
# The shared core arrives as an XCFramework built by
# ../scripts/build-xcframework.sh, which must have been run at least once.

name: Fathom

options:
  bundleIdPrefix: uk.ewancroft
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Release signing is supplied on the xcodebuild command line by
# scripts/release-ios.sh (team, manual style and provisioning profile). The
# project deliberately contains no team, certificate or profile.
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The framework script touches files outside the project directory, which
    # the script-sandbox refuses by default.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    # The XCFramework carries one simulator slice, arm64. Xcode refuses to
    # combine arm64 and x86_64 simulator slices as "two equivalent library
    # definitions", so an Intel Mac cannot link the shared core and says so
    # here rather than at the linker.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  Fathom:
    type: application
    platform: iOS
    sources:
      - path: Fathom
    dependencies:
      # Static Kotlin/Native framework: link it, do not embed it.
      - framework: ../shared/FathomShared.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.ewancroft.fathom
        PRODUCT_NAME: Fathom
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "10"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Fathom
        CFBundleShortVersionString: "0.2.1"
        CFBundleVersion: "10"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

  # Not part of the default scheme: it needs the public network and minutes
  # of paging against a real repo. Run it with `-scheme FathomAccount`.
  FathomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FathomUITests
    dependencies:
      - target: Fathom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.ewancroft.fathom.uitests
        GENERATE_INFOPLIST_FILE: YES

  FathomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FathomTests
    dependencies:
      - target: Fathom
      - framework: ../shared/FathomShared.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.ewancroft.fathom.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Fathom:
    build:
      targets:
        Fathom: all
        FathomTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FathomTests

  FathomAccount:
    build:
      targets:
        Fathom: all
        FathomUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FathomUITests
