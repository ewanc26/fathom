name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-android:
    name: Shared tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            Android/**/*.gradle*
            Android/gradle.properties
            Android/gradle/libs.versions.toml
            Android/gradle/wrapper/gradle-wrapper.properties
            shared/**/*.gradle*

      - name: Install Android 36 platform
        # ubuntu-latest is the Ubuntu 26.04 image since October 2026, and it no
        # longer puts sdkmanager on PATH. Resolve it from ANDROID_HOME instead.
        run: |
          set -eu
          for candidate in \
            "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            /usr/local/lib/android/sdk/cmdline-tools/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              exec "$candidate" --install "platforms;android-36"
            fi
          done
          echo "sdkmanager not found; ANDROID_HOME=${ANDROID_HOME:-unset}" >&2
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" >&2 2>/dev/null || true
          exit 1

      - name: Run shared tests and build Android
        # Surface the tail of the build log as annotations while the failure
        # is pinned down; the full log still goes to the step.
        working-directory: Android
        run: |
          set +e
          ./gradlew :shared:jvmTest :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 15 /tmp/gradle.log | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit "$status"
          fi

  icons:
    name: Generated icon check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check generated assets
        run: python3 scripts/gen-icon.py --check

  ios:
    name: iOS unit tests
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            Android/**/*.gradle*
            Android/gradle.properties
            Android/gradle/libs.versions.toml
            Android/gradle/wrapper/gradle-wrapper.properties
            shared/**/*.gradle*

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Install Android 36 platform
        # The shared module is an Android library (compileSdk 36); Gradle
        # configures it even when only the iOS slices are linked, so the
        # platform must exist on the macOS runner too.
        run: |
          set -eu
          for candidate in \
            "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            /usr/local/lib/android/sdk/cmdline-tools/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              exec "$candidate" --install "platforms;android-36"
            fi
          done
          echo "sdkmanager not found; ANDROID_HOME=${ANDROID_HOME:-unset}" >&2
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" >&2 2>/dev/null || true
          exit 1

      - name: Verify Gradle wrapper
        # Bisects wrapper download vs configuration failures on the macOS
        # runner: this only resolves the distribution and prints the version.
        working-directory: Android
        run: ./gradlew --version --no-daemon

      - name: Build shared XCFramework
        # Surface the tail of the build log as annotations: the step log needs
        # sign-in, annotations show on the public summary.
        run: |
          set +e
          bash ./scripts/build-xcframework.sh 2>&1 | tee /tmp/xcframework.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 15 /tmp/xcframework.log | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit "$status"
          fi

      - name: Generate Xcode project
        working-directory: iOS
        run: xcodegen generate

      - name: Run iOS unit tests
        working-directory: iOS
        run: |
          device_id=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select((.deviceTypeIdentifier // "") | contains("iPhone")) | .udid] | first // empty')
          if [ -z "$device_id" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Testing on simulator $device_id"
          xcodebuild test \
            -project Fathom.xcodeproj \
            -scheme Fathom \
            -destination "platform=iOS Simulator,id=$device_id" \
            -only-testing:FathomTests \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
