name: Release

# A tag push builds signed Android and iOS artifacts and publishes them on a
# GitHub Release. A manual dispatch builds the same artifacts without
# publishing, which is useful before a tag exists. Signing material comes from
# the protected "release" environment and is never checked in. See
# docs/RELEASE.md for the checklist and secret names.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version-check:
    name: Check version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Compare the tag with version.properties
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^versionName=//p' version.properties)"
          code="$(sed -n 's/^versionCode=//p' version.properties)"
          if [ -z "$version" ] || [ -z "$code" ]; then
            echo "::error::version.properties must contain versionName and versionCode"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: building artifacts only; nothing will be published."
            exit 0
          fi

          expected="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $expected from version.properties"
            exit 1
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  android:
    name: Signed Android artifacts
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            Android/**/*.gradle*
            Android/gradle.properties
            Android/gradle/libs.versions.toml
            Android/gradle/wrapper/gradle-wrapper.properties
            shared/**/*.gradle*

      - name: Install Android 36 platform
        # ubuntu-latest no longer puts sdkmanager on PATH; resolve it from
        # ANDROID_HOME, the same way CI does.
        run: |
          set -eu
          for candidate in \
            "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            /usr/local/lib/android/sdk/cmdline-tools/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              exec "$candidate" --install "platforms;android-36"
            fi
          done
          echo "sdkmanager not found; ANDROID_HOME=${ANDROID_HOME:-unset}" >&2
          exit 1

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set in the release environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fathom-release.jks"
          test -s "$RUNNER_TEMP/fathom-release.jks"

      - name: Build signed Android artifacts
        env:
          FATHOM_KEYSTORE_FILE: ${{ runner.temp }}/fathom-release.jks
          FATHOM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FATHOM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FATHOM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/release-android.sh

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/release/android/Fathom-*.aab
            build/release/android/Fathom-*.apk
            build/release/android/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  ios:
    name: Signed iOS IPA
    needs: version-check
    runs-on: macos-latest
    timeout-minutes: 55
    environment: release
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            Android/**/*.gradle*
            Android/gradle.properties
            Android/gradle/libs.versions.toml
            Android/gradle/wrapper/gradle-wrapper.properties
            shared/**/*.gradle*

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Install Android 36 platform
        # The shared module is an Android library (compileSdk 36); Gradle
        # configures it even when only the iOS slices are linked.
        run: |
          set -eu
          for candidate in \
            "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            /usr/local/lib/android/sdk/cmdline-tools/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              exec "$candidate" --install "platforms;android-36"
            fi
          done
          echo "sdkmanager not found; ANDROID_HOME=${ANDROID_HOME:-unset}" >&2
          exit 1

      - name: Check signing secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          missing=0
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID IOS_PROVISIONING_PROFILE_SPECIFIER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set in the release environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/fathom-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/fathom-certificate.p12"
          security import "$RUNNER_TEMP/fathom-certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/fathom.mobileprovision"
          profile_uuid="$(security cms -D -i "$RUNNER_TEMP/fathom.mobileprovision" | \
            python3 -c 'import plistlib, sys; print(plistlib.load(sys.stdin.buffer)["UUID"])')"
          cp "$RUNNER_TEMP/fathom.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

      - name: Build signed iOS IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: ./scripts/release-ios.sh

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/fathom-signing.keychain-db" || true

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            build/release/ios/Fathom-*.ipa
            build/release/ios/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version-check, android, ios]
    if: needs.version-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version-check.outputs.tag }}
          VERSION: ${{ needs.version-check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name 'Fathom-*' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'SHA256SUMS' -exec sh -c \
            'cp "$1" "release-assets/$(basename "$(dirname "$1")")-SHA256SUMS"' _ {} \;
          mapfile -t files < <(find release-assets -type f -print | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts were downloaded"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Fathom $VERSION" \
              --generate-notes \
              --verify-tag
          fi
