name: Release provenance

# Fathom releases are assembled and signed locally by
# tools/release/publish.mjs; this workflow never builds, signs or publishes
# an APK/IPA. Once a unified vX.Y.Z release exists, it generates an SBOM for
# each platform, hashes the exact binaries already attached to the release,
# writes a release manifest, attests the manifest and SBOMs, and attaches
# them. See RELEASE_PROCESS.md.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (for example v0.2.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-provenance-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate the tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TAG: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release) TAG="$RELEASE_TAG" ;;
            workflow_dispatch) TAG="$DISPATCH_TAG" ;;
            *) TAG="$REF_TAG" ;;
          esac
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a unified release tag (vX.Y.Z)."
            exit 1
          fi
          echo "Resolved tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  android-sbom:
    name: Android SBOM
    needs: resolve-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Generate Android SBOM (Gradle dependencies)
        uses: anchore/sbom-action@v0
        with:
          path: Android
          format: spdx-json
          output-file: sbom-android-${{ needs.resolve-tag.outputs.tag }}.spdx.json

      - name: Upload Android SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-android
          path: sbom-android-*.spdx.json
          retention-days: 14
          if-no-files-found: error

  ios-sbom:
    name: iOS SBOM
    needs: resolve-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate iOS SBOM
        run: |
          node tools/release/generate-ios-sbom.mjs \
            "sbom-ios-${{ needs.resolve-tag.outputs.tag }}.spdx.json" \
            --version "${{ needs.resolve-tag.outputs.tag }}"

      - name: Upload iOS SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-ios
          path: sbom-ios-*.spdx.json
          retention-days: 14
          if-no-files-found: error

  manifest-and-attest:
    name: Release manifest, attestation and upload
    needs: [resolve-tag, android-sbom, ios-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Android SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-android
          path: sbom

      - name: Download iOS SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-ios
          path: sbom

      - name: Verify the release and download its exact binaries
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No GitHub Release found for $TAG. Run tools/release/publish.mjs first; this workflow only adds provenance to an existing release."
            exit 1
          fi
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir release-assets --pattern "Fathom-*.apk" --clobber || true
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir release-assets --pattern "Fathom-*.ipa" --clobber || true
          ls -la release-assets
          if ! find release-assets -type f \( -name '*.apk' -o -name '*.ipa' \) | grep -q .; then
            echo "::error::No APK or IPA is attached to $TAG; publish a signed binary before provenance."
            exit 1
          fi

      - name: Build the release manifest
        run: |
          set -euo pipefail
          commit="$(git rev-parse "${TAG}^{commit}")"
          node tools/release/build-release-manifest.mjs \
            --tag "$TAG" \
            --assets-dir release-assets \
            --sbom-dir sbom \
            --commit "$commit" \
            --out "release-manifest-${TAG}.json"

      - name: Attest the manifest and SBOMs (not the binaries)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-manifest-${{ needs.resolve-tag.outputs.tag }}.json
            sbom/*.spdx.json

      - name: Attach the manifest and SBOMs
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "release-manifest-${TAG}.json" \
            sbom/*.spdx.json \
            --repo "$GITHUB_REPOSITORY" --clobber
