# Fathom Android Gradle properties.
#
# org.gradle.java.home is deliberately not set. It used to be hardcoded in the
# sibling projects to one machine's JDK path, which broke every other machine
# and CI. Set it in your own ~/.gradle/gradle.properties instead.
#
# android.useAndroidX: required for Compose and Material 3.
# android.nonTransitiveRClass: smaller APKs, the Gradle 8+ default.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
